services:
  manas-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manas-backend
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-groq/compound-mini}
      - CRISIS_THRESHOLD=${CRISIS_THRESHOLD:-0.7}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./data:/app/data
